version: "3.8"

services:
  app:
    build:
      context: ../app
      dockerfile: Dockerfile
      target: prod
    ports:
      - "3001:3001"
    environment:
      HOST: "0.0.0.0"
      PORT: "3001"
      NUXT_PORT: "3001"
      NITRO_PORT: "3001"
      NUXT_PUBLIC_POCKETBASE_SERVER_BASE_URL: http://pocketbase:8081
      NUXT_PUBLIC_POCKETBASE_CLIENT_BASE_URL: http://localhost:8081
      NUXT_PLAUSIBLE_TRACKING_DOMAIN: ""
    networks:
      - leihbar_tests

  pocketbase:
    build:
      context: ../pocketbase
      dockerfile: Dockerfile
      target: test
      args:
        PORT: "8081"
    ports:
      - "8081:8081"
    environment:
      CONFIG_LOCALE: "en"
      # If a reservation needs to have a user, or not
      CONFIG_RESERVATION_REQUIRE_USER: "false"
      CONFIG_LENDING_CONDITIONS_LINK: "https://example.com/lending-conditions"
    volumes:
      - ../pocketbase/pb_migrations:/pb/pb_migrations
      - ../pocketbase/pb_hooks:/pb/pb_hooks
      - /pb/pb_data
    networks:
      - leihbar_tests

  mailhog:
    image: mailhog/mailhog
    logging:
      driver: "none" # disable saving logs
    ports:
      - 1025:1025 # smtp server
      - 8025:8025 # web ui
    networks:
      - leihbar_tests

networks:
  leihbar_tests:
